# Pages 서빙 진단 — 배포된 github.io 사이트의 핵심 자산을 외부(러너)에서 직접 fetch 해
# HTTP 상태·크기·소요시간을 기록한다. 컨테이너 프록시가 github.io 를 막아 세션에서 직접
# 확인이 불가하므로 러너를 프로브로 사용. (진단 후 삭제 가능)
name: pages-probe
on:
  workflow_dispatch:
  push:
    branches: [claude/deal-angle-radar-edit-quuzhg]
    paths: [.github/workflows/pages-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch deployed assets
        run: |
          BASE=https://minabae-5723.github.io/deal-angle-radar
          for p in "" "index.html" "app.js?v=4" "narrative.js?v=6" "chat.js?v=2" \
                   "data/index.json" "data/theses.json" "data/thesis-candidates.json" \
                   "data/narrative-pool.json" "data/funding-pool.json" "diag.html"; do
            echo "=== $BASE/$p"
            curl -sS -o /tmp/body -w "code=%{http_code} size=%{size_download} time=%{time_total}s content-type=%{content_type}\n" \
              --max-time 60 "$BASE/$p" || echo "CURL FAILED"
            head -c 120 /tmp/body | tr -d '\n'; echo; echo
          done
          echo "=== HTML script tags served:"
          curl -sS "$BASE/index.html" | grep -o 'script src="[^"]*"' || true
