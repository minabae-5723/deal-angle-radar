<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deal Angle Radar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A1%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css?v=27" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-ico">📡</span>
      <div>
        <div class="brand-title">Deal Angle Radar</div>
        <div class="brand-sub">DART 공시 24h 스크리닝 + 재무 바텀업 자금소요 진단 → PE 딜 앵글</div>
      </div>
    </div>
    <div class="topbar-meta">
      <span id="clock">—</span>
    </div>
  </div>
  <nav class="viewtabs" id="viewTabs">
    <button class="viewtab active" data-view="narrative">📐 네러티브 스크리너</button>
    <button class="viewtab" data-view="radar">📡 일별 공시 레이더</button>
    <button class="viewtab" data-view="funding">💰 자금소요 스크리너</button>
    <button class="viewtab" data-view="thesis">🧭 Thesis 보드</button>
    <button class="viewtab" data-view="review">📄 기업 검토</button>
  </nav>
</header>

<main class="main">

  <!-- ═══════════ view: 일별 공시 레이더 ═══════════ -->
  <section id="view-radar" class="view">
    <div class="controls">
      <span class="controls-label">일자</span>
      <div class="date-pills" id="datePills">
        <span class="loading">로딩 중…</span>
      </div>
    </div>

    <div id="body" class="radar-body">
      <div class="empty">
        <div class="empty-ico">🎯</div>
        <h3>아직 저장된 스크리닝이 없습니다</h3>
        <p>/deal-angle 세션이 DART 공시를 스크리닝하면 여기에 표시됩니다.</p>
      </div>
    </div>
  </section>

  <!-- ═══════════ view: 자금소요 스크리너 ═══════════ -->
  <section id="view-funding" class="view" hidden>
    <div id="fundingRoot">
      <div class="empty"><div class="empty-ico">💰</div><h3>로딩 중…</h3></div>
    </div>
  </section>

  <!-- ═══════════ view: Thesis 보드 ═══════════ -->
  <section id="view-thesis" class="view" hidden>
    <div id="thesisRoot">
      <div class="empty"><div class="empty-ico">🧭</div><h3>로딩 중…</h3></div>
    </div>
  </section>

  <!-- ═══════════ view: 기업 검토 (Company Review Board) ═══════════ -->
  <!-- code\company-review 를 /review 정션으로 동일 오리진 제공 → iframe 으로 비춘다.
       3-agent(기업분석 0~2 · 사업분석 3~4 · 투자분석 5~6)가 각자 company-review\data\*.json 에
       계속 쓰고, 이 탭은 그 결과를 그대로 보여준다. 포팅하지 않는 이유 = 상위 세션의 편집이 즉시 반영되어야 함. -->
  <section id="view-review" class="view" hidden>
    <iframe id="reviewFrame" class="review-frame" title="Company Review Board" src="about:blank"></iframe>
  </section>

  <!-- ═══════════ view: 네러티브 스크리너 ═══════════ -->
  <section id="view-narrative" class="view" hidden>
    <div id="narrativeRoot">
      <div class="empty"><div class="empty-ico">📐</div><h3>로딩 중…</h3></div>
    </div>
  </section>

  <footer class="footer">
    <p id="footNote">Source: DART OpenAPI (주요사항보고 · 지분공시) + 뉴스 크로스체크 · 스크리닝: /deal-angle 세션 · Reverent Partners 내부용</p>
  </footer>
</main>

<!-- 로컬 전용 뷰 게이트 — 배포본(GitHub Pages)에서 탭과 섹션을 DOM 에서 제거한다.
       · review  : /review 는 code\company-review 로 향하는 로컬 정션이고 .gitignore 로 배포에서 빠진다.
                   PE 내부 검토 문서를 public Pages 에 올리지 않기 위한 의도적 로컬 전용. (2026-08-20)
       · funding  : 자금소요 스크리너 — 외감 재무·자금니즈 진단 원자료 성격이라 외부 공유에서 제외. (2026-08-25)
       · thesis   : Thesis 보드(구버전) — 네러티브 스크리너로 통합되어 배포본에서는 감춘다. (2026-08-25)
     app.js 의 switchView 는 없는 섹션을 건너뛰도록 null 가드가 있으므로 제거해도 안전하다. -->
<script>
  (function () {
    var host = location.hostname;
    if (host === 'localhost' || host === '127.0.0.1' || host === '::1' || host === '[::1]' || host === '') return;
    var LOCAL_ONLY = ['review', 'funding', 'thesis'];
    if (LOCAL_ONLY.indexOf(location.hash.replace('#', '')) >= 0) location.replace(location.pathname + location.search);
    LOCAL_ONLY.forEach(function (v) {
      var tab = document.querySelector('.viewtab[data-view="' + v + '"]');
      if (tab) tab.remove();
      var view = document.getElementById('view-' + v);
      if (view) view.remove();
    });
  })();
</script>
<!-- 오류 자가보고 배너: 스크립트 예외·비동기 거부를 화면 상단에 그대로 표시 (원격 디버깅용, ES5) -->
<script>
(function () {
  var box = null, n = 0;
  function show(msg) {
    if (n >= 6) return; n++;
    if (!box) {
      box = document.createElement('div');
      box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#c62828;color:#fff;font:12px/1.5 sans-serif;padding:8px 12px;white-space:pre-wrap;word-break:break-all;';
      document.body ? document.body.appendChild(box) : document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(box); });
    }
    var d = document.createElement('div');
    d.textContent = '⚠ ' + msg;
    box.appendChild(d);
  }
  window.addEventListener('error', function (e) {
    var f = (e.filename || '').split('/').pop();
    show('JS 오류: ' + (e.message || e.type) + (f ? ' @ ' + f + ':' + e.lineno : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    show('비동기 오류: ' + (r && (r.stack || r.message) || String(r)));
  });
})();
</script>
<script src="app.js?v=6"></script>
<script src="funding.js?v=2"></script>
<script src="thesis.js?v=9"></script>
<script src="comments.js?v=2"></script>
<script src="narrative.js?v=29"></script>
<script src="chat.js?v=6"></script>
</body>
</html>
