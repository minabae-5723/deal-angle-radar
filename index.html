<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deal Angle Radar</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-ico">🎯</span>
      <div>
        <div class="brand-title">Deal Angle Radar</div>
        <div class="brand-sub">DART 주요사항보고 · 지분공시 24h 스크리닝 → PE 딜 앵글 시그널</div>
      </div>
    </div>
    <div class="topbar-meta">
      <span id="clock">—</span>
    </div>
  </div>
</header>

<main class="main">
  <div class="controls">
    <span class="controls-label">일자</span>
    <div class="date-pills" id="datePills">
      <span class="loading">로딩 중…</span>
    </div>
  </div>

  <div id="body" class="radar-body">
    <div class="empty">
      <div class="empty-ico">🎯</div>
      <h3>아직 저장된 스크리닝이 없습니다</h3>
      <p>/deal-angle 세션이 DART 공시를 스크리닝하면 여기에 표시됩니다.</p>
    </div>
  </div>

  <footer class="footer">
    <p>Source: DART OpenAPI (주요사항보고 · 지분공시) + 뉴스 크로스체크 · 스크리닝: /deal-angle 세션 · Reverent Partners 내부용</p>
  </footer>
</main>

<script src="app.js"></script>
</body>
</html>
